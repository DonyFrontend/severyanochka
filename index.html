<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Северяночка — Избранное</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header__inner">
    <a class="logo" href="#" aria-label="Северяночка — на главную">
      <svg class="logo__icon" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="#F3EEDD" stroke="#2E2A22" stroke-width="1.2"/>
        <ellipse cx="13" cy="16" rx="3.2" ry="4.4" fill="#2E2A22"/>
        <ellipse cx="27" cy="16" rx="3.2" ry="4.4" fill="#2E2A22"/>
        <path d="M11 23c2 3 6 4 9 4s7-1 9-4" stroke="#2E2A22" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle cx="14.5" cy="20.5" r="1.3" fill="#2E2A22"/>
        <circle cx="25.5" cy="20.5" r="1.3" fill="#2E2A22"/>
      </svg>
      <span class="logo__text">СЕВЕРЯНОЧКА</span>
    </a>

    <form class="search" role="search" onsubmit="return false;">
      <input class="search__input" type="search" id="searchInput" placeholder="Найти товар" autocomplete="off">
      <button class="search__btn" type="submit" aria-label="Искать">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10 2a8 8 0 105.29 14.02l4.35 4.34 1.4-1.41-4.34-4.35A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z" fill="#8a8a8a"/></svg>
      </button>
    </form>

    <nav class="header__nav">
      <a class="nav__link nav__link--active" href="#">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2 4 6 4c2.2 0 3.9 1.2 6 3.3C14.1 5.2 15.8 4 18 4c4 0 5.5 4 4 7.7C19.5 16.4 12 21 12 21z" fill="none" stroke="#e2662b" stroke-width="1.7"/></svg>
        <span>Избранное</span>
        <span class="nav__badge" id="favCount">8</span>
      </a>
      <a class="nav__link" href="#">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6h15l-1.5 9h-12z" fill="none" stroke="#2E2A22" stroke-width="1.7"/><circle cx="9" cy="20" r="1.4" fill="#2E2A22"/><circle cx="17" cy="20" r="1.4" fill="#2E2A22"/><path d="M3 3h2l1 3" fill="none" stroke="#2E2A22" stroke-width="1.7"/></svg>
        <span>Корзина</span>
        <span class="nav__badge nav__badge--cart" id="cartCount">1</span>
      </a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="breadcrumbs">
    <a href="#">Главная</a>
    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="#a8a294" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Избранное</span>
  </div>

  <section class="favorites">
    <h1 class="favorites__title">Избранное</h1>

    <div class="filters" id="filters">
      <span class="chip chip--price" id="priceChip">
        Цена от 99 до 2599
        <button class="chip__x" data-remove="price" aria-label="Убрать фильтр по цене">
          <svg viewBox="0 0 24 24" width="12" height="12"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </span>
      <button class="chip chip--clear" id="clearFilters">
        Очистить
        <svg viewBox="0 0 24 24" width="12" height="12"><path d="M6 6l12 12M18 6L6 18" stroke="#7a7566" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="grid" id="productGrid"><!-- product cards injected by JS --></div>

    <nav class="pagination" id="pagination" aria-label="Страницы">
      <button class="page-btn page-btn--edge" data-page="prev" aria-label="Первая страница">&laquo;</button>
      <button class="page-btn page-btn--edge" data-page="prev1" aria-label="Предыдущая страница">&lsaquo;</button>
      <button class="page-btn page-btn--num is-active" data-page="1">1</button>
      <button class="page-btn page-btn--num" data-page="2">2</button>
      <button class="page-btn page-btn--num" data-page="3">3</button>
      <button class="page-btn page-btn--num" data-page="4">4</button>
      <button class="page-btn page-btn--num" data-page="5">5</button>
      <button class="page-btn page-btn--num" data-page="6">6</button>
      <button class="page-btn page-btn--num" data-page="7">7</button>
      <button class="page-btn page-btn--num" data-page="8">8</button>
      <button class="page-btn page-btn--edge" data-page="next1" aria-label="Следующая страница">&rsaquo;</button>
      <button class="page-btn page-btn--edge" data-page="next" aria-label="Последняя страница">&raquo;</button>
    </nav>
  </section>
</main>

<footer class="footer">
  <div class="footer__inner">
    <a class="logo logo--footer" href="#">
      <svg class="logo__icon" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="#F3EEDD" stroke="#2E2A22" stroke-width="1.2"/>
        <ellipse cx="13" cy="16" rx="3.2" ry="4.4" fill="#2E2A22"/>
        <ellipse cx="27" cy="16" rx="3.2" ry="4.4" fill="#2E2A22"/>
        <path d="M11 23c2 3 6 4 9 4s7-1 9-4" stroke="#2E2A22" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="logo__text">СЕВЕРЯНОЧКА</span>
    </a>

    <nav class="footer__nav">
      <a href="#">О компании</a>
      <a href="#">Контакты</a>
      <a href="#">Вакансии</a>
      <a href="#">Статьи</a>
      <a href="#">Политика обработки персональных данных</a>
    </nav>

    <div class="footer__side">
      <div class="socials">
        <a href="#" aria-label="Instagram" class="social">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="5" fill="#2E2A22"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="#F3EEDD" stroke-width="1.6"/><circle cx="17" cy="7" r="1.1" fill="#F3EEDD"/></svg>
        </a>
        <a href="#" aria-label="VKontakte" class="social">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="5" fill="#2E2A22"/><text x="12" y="16.5" font-size="10.5" font-family="Arial, sans-serif" fill="#F3EEDD" text-anchor="middle" font-weight="700">VK</text></svg>
        </a>
        <a href="#" aria-label="Facebook" class="social">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="5" fill="#2E2A22"/><text x="12" y="16.5" font-size="12" font-family="Arial, sans-serif" fill="#F3EEDD" text-anchor="middle" font-weight="700">f</text></svg>
        </a>
        <a href="#" aria-label="Odnoklassniki" class="social">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="5" fill="#2E2A22"/><text x="12" y="16.5" font-size="10" font-family="Arial, sans-serif" fill="#F3EEDD" text-anchor="middle" font-weight="700">OK</text></svg>
        </a>
      </div>
      <a class="phone" href="tel:88007773333">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.2 1.1l-2.2 2.2z" fill="#2E2A22"/></svg>
        8 800 777 33 33
      </a>
      <span class="design-credit">Дизайн ZASOVSKIY</span>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
