<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Северяночка — Избранное</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <div class="breadcrumbs">
        <a href="../index.html">Главная</a>
        <img src="./images/chevron-right.svg" alt="" />
        <span>Избранное</span>
      </div>

      <section class="favorites">
        <h1 class="favorites__title">Избранное</h1>

        <div class="filters">
          <span class="chip chip--price">
            Цена от 99 до 2599
            <button
              class="chip__x"
              type="button"
              aria-label="Убрать фильтр по цене"
            >
              <svg viewBox="0 0 24 24" width="12" height="12">
                <path
                  d="M6 6l12 12M18 6L6 18"
                  stroke="#fff"
                  stroke-width="2.4"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </span>
          <button class="chip chip--clear" type="button">
            Очистить
            <svg viewBox="0 0 24 24" width="12" height="12">
              <path
                d="M6 6l12 12M18 6L6 18"
                stroke="#7a7566"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>

        <div class="grid" id="productGrid">
          <!-- product cards injected by JS -->
        </div>

        <nav class="pagination" aria-label="Страницы">
          <button
            class="page-btn page-btn--edge"
            data-page="prev"
            aria-label="Первая страница"
          >
            &laquo;
          </button>
          <button
            class="page-btn page-btn--edge"
            data-page="prev1"
            aria-label="Предыдущая страница"
          >
            &lsaquo;
          </button>
          <button class="page-btn page-btn--num is-active" data-page="1">
            1
          </button>
          <button class="page-btn page-btn--num" data-page="2">2</button>
          <button class="page-btn page-btn--num" data-page="3">3</button>
          <button class="page-btn page-btn--num" data-page="4">4</button>
          <button class="page-btn page-btn--num" data-page="5">5</button>
          <button class="page-btn page-btn--num" data-page="6">6</button>
          <button class="page-btn page-btn--num" data-page="7">7</button>
          <button class="page-btn page-btn--num" data-page="8">8</button>
          <button
            class="page-btn page-btn--edge"
            data-page="next1"
            aria-label="Следующая страница"
          >
            &rsaquo;
          </button>
          <button
            class="page-btn page-btn--edge"
            data-page="next"
            aria-label="Последняя страница"
          >
            &raquo;
          </button>
        </nav>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <a class="logo logo--footer" href="#">
          <svg
            class="logo__icon"
            viewBox="0 0 40 40"
            width="34"
            height="34"
            aria-hidden="true"
          >
            <circle
              cx="20"
              cy="20"
              r="19"
              fill="#F3EEDD"
              stroke="#2E2A22"
              stroke-width="1.2"
            />
            <ellipse cx="13" cy="16" rx="3.2" ry="4.4" fill="#2E2A22" />
            <ellipse cx="27" cy="16" rx="3.2" ry="4.4" fill="#2E2A22" />
            <path
              d="M11 23c2 3 6 4 9 4s7-1 9-4"
              stroke="#2E2A22"
              stroke-width="1.6"
              fill="none"
              stroke-linecap="round"
            />
          </svg>
          <span class="logo__text">СЕВЕРЯНОЧКА</span>
        </a>

        <nav class="footer__nav">
          <a href="../about_company/index.html">О компании</a>
          <a href="#">Контакты</a>
          <a href="#">Вакансии</a>
          <a href="#">Статьи</a>
          <a href="#">Политика обработки персональных данных</a>
        </nav>

        <div class="footer__side">
          <div class="socials">
            <a href="#" aria-label="Instagram" class="social">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  rx="5"
                  fill="#2E2A22"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="4.2"
                  fill="none"
                  stroke="#F3EEDD"
                  stroke-width="1.6"
                />
                <circle cx="17" cy="7" r="1.1" fill="#F3EEDD" />
              </svg>
            </a>
            <a href="#" aria-label="VKontakte" class="social">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  rx="5"
                  fill="#2E2A22"
                />
                <text
                  x="12"
                  y="16.5"
                  font-size="10.5"
                  font-family="Arial, sans-serif"
                  fill="#F3EEDD"
                  text-anchor="middle"
                  font-weight="700"
                >
                  VK
                </text>
              </svg>
            </a>
            <a href="#" aria-label="Facebook" class="social">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  rx="5"
                  fill="#2E2A22"
                />
                <text
                  x="12"
                  y="16.5"
                  font-size="12"
                  font-family="Arial, sans-serif"
                  fill="#F3EEDD"
                  text-anchor="middle"
                  font-weight="700"
                >
                  f
                </text>
              </svg>
            </a>
            <a href="#" aria-label="Odnoklassniki" class="social">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  rx="5"
                  fill="#2E2A22"
                />
                <text
                  x="12"
                  y="16.5"
                  font-size="10"
                  font-family="Arial, sans-serif"
                  fill="#F3EEDD"
                  text-anchor="middle"
                  font-weight="700"
                >
                  OK
                </text>
              </svg>
            </a>
          </div>
          <a class="phone" href="tel:88007773333">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.2 1.1l-2.2 2.2z"
                fill="#2E2A22"
              />
            </svg>
            8 800 777 33 33
          </a>
          <span class="design-credit">Дизайн ZASOVSKIY</span>
        </div>
      </div>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
