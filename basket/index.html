<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Северяночка — Корзина</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <div class="breadcrumbs">
        <a href="../index.html">Главная</a>
        <span>/</span>
        <span>Корзина</span>
      </div>

      <h1>Корзина <span id="cart-count">0</span></h1>

      <div class="cart">
        <section class="cart-left">
          <div class="top-panel">
            <label>
              <input type="checkbox" />
              Выделить всё
            </label>

            <button class="remove-selected" type="button">
              Удалить выбранные
            </button>
          </div>

          <div id="cart-list"></div>
        </section>

        <aside class="cart-right">
          <div class="bonus">
            <div class="bonus-top">
              <label class="switch">
                <input type="checkbox" checked />
                <span class="slider"></span>
              </label>
              <span class="bonus-text">Списать 200 ₽</span>
            </div>
            <p>На карте накоплено 200 ₽</p>
          </div>

          <h3>Ваш заказ</h3>
          <div class="row">
            <span id="order-count">0 товаров</span>
            <span id="order-sum">0 ₽</span>
          </div>
          <div class="row">
            <span>Скидка</span>
            <span class="sale" id="order-sale">0 ₽</span>
          </div>
          <hr />
          <div class="total">
            <span>Итого</span>
            <strong id="order-total">0 ₽</strong>
          </div>
          <button class="order" type="button">Оформить заказ</button>
        </aside>
      </div>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
