<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Северяночка — Карточка товара</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a class="logo" href="../index.html">
          <span class="logo__mark">С</span>
          <span class="logo__text">СЕВЕРЯНОЧКА</span>
        </a>

        <form class="search" onsubmit="return false;">
          <input id="searchInput" type="search" placeholder="Найти товар" />
          <button type="submit">Найти</button>
        </form>

        <nav class="header__nav">
          <a href="../index.html">
            Избранное
            <span id="favCount">0</span>
          </a>
          <a href="../basket/index.html">
            Корзина
            <span id="cartCount">0</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="main-container">
      <div class="breadcrumbs">
        <a href="../index.html">Главная</a>
        <span>/</span>
        <span id="breadcrumbProduct">Товар</span>
      </div>

      <section class="product-head">
        <h1 id="product-title"></h1>
        <div class="product-meta">
          <span id="product-article"></span>
          <span class="stars" id="product-rating"></span>
          <button class="favorite-action" id="main-favorite-btn" type="button">
            В избранное
          </button>
        </div>
      </section>

      <section class="product-grid">
        <div class="gallery-container">
          <div class="thumbnails" id="thumbs"></div>
          <div class="main-image-wrapper">
            <span class="badge-discount" id="badge-discount"></span>
            <div class="main-image" id="main-img"></div>
          </div>
        </div>

        <div class="details-container">
          <div class="price-section">
            <div>
              <span class="old-price" id="old-price"></span>
              <span class="price-label">Обычная цена</span>
            </div>
            <div>
              <span class="current-price" id="current-price"></span>
              <span class="price-label" id="price-note"></span>
            </div>
          </div>

          <button class="add-to-cart-btn" id="add-to-cart-btn" type="button">
            В корзину
          </button>

          <div class="bonus-info">Вы получаете <strong>10 бонусов</strong></div>
          <button class="price-alert" type="button">Уведомить о снижении цены</button>

          <div class="specs">
            <div class="spec-row">
              <span class="spec-label">Бренд</span>
              <span id="product-brand"></span>
            </div>
            <div class="spec-row">
              <span class="spec-label">Страна производитель</span>
              <span id="product-country"></span>
            </div>
            <div class="spec-row">
              <span class="spec-label">Упаковка</span>
              <span id="product-packing"></span>
            </div>
          </div>
        </div>

        <aside class="similar-container">
          <h2>Похожие</h2>
          <div id="similar-list"></div>
        </aside>
      </section>

      <section class="product-section">
        <h2>С этим товаром покупают</h2>
        <div class="product-container" id="cross-sell-list"></div>
      </section>

      <section class="product-section">
        <div class="section-top">
          <h2>Акции</h2>
          <a href="../index.html">Все акции</a>
        </div>
        <div class="product-container" id="sale-list"></div>
      </section>
    </main>

    <footer class="footer">
      <a class="logo" href="../index.html">
        <span class="logo__mark">С</span>
        <span class="logo__text">СЕВЕРЯНОЧКА</span>
      </a>
      <nav>
        <a href="../about_company/index.html">О компании</a>
        <a href="#">Контакты</a>
        <a href="#">Вакансии</a>
        <a href="#">Статьи</a>
      </nav>
      <a href="tel:88007773333">8 800 777 33 33</a>
    </footer>

    <script type="module" src="./script.js"></script>
  </body>
</html>
